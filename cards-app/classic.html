<style>
body{
    margin:0;
    font-family:Tahoma;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:white;
    text-align:center;
}

header{
    padding:15px;
}

#turnInfo{
    font-size:18px;
    font-weight:bold;
    margin-bottom:10px;
}

button{
    padding:10px 20px;
    border:none;
    border-radius:15px;
    background:#ff4b2b;
    color:white;
    margin:5px;
    cursor:pointer;
}

.container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:12px;
    padding:12px;
}

.card{
    perspective:1000px;
}

.inner{
    position:relative;
    height:160px;
    transition:0.7s;
    transform-style:preserve-3d;
    cursor:pointer;
}

.card.flipped .inner{
    transform:rotateY(180deg);
}

.front, .back{
    position:absolute;
    width:100%;
    height:100%;
    border-radius:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:10px;
    backface-visibility:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,0.5);
}

.back{
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(10px);
    font-size:28px;
}

.front{
    transform:rotateY(180deg);
    font-size:14px;
}

.romantic{ background:linear-gradient(45deg,#ff758c,#ff7eb3);}
.challenge{ background:linear-gradient(45deg,#ff512f,#dd2476);}
.fun{ background:linear-gradient(45deg,#f7971e,#ffd200); color:black;}
.deep{ background:linear-gradient(45deg,#00c6ff,#0072ff);}
.locked{filter:blur(4px);pointer-events:none;}

.popup{
    position:fixed;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,0.8);
    backdrop-filter:blur(10px);
    padding:15px 25px;
    border-radius:20px;
    font-size:16px;
    max-width:80%;
    opacity:0;
    transition:opacity 0.5s;
}

/* Wheel */
#wheelContainer{
    position:relative;
    width:250px;
    height:250px;
    margin:20px auto;
}

#wheel{
    width:100%;
    height:100%;
    border-radius:50%;
    position:relative;
    overflow:hidden;
    transition: transform 5s cubic-bezier(0.33,1,0.68,1);
}

/* تقسيم العجلة لنصفين */
#halfBlue{
    position:absolute;
    width:100%;
    height:100%;
    clip-path: polygon(50% 50%, 100% 0, 100% 100%);
    background:blue;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:18px;
}

#halfPink{
    position:absolute;
    width:100%;
    height:100%;
    clip-path: polygon(50% 50%, 0 0, 0 100%);
    background:pink;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:18px;
}

/* السهم الأحمر */
#arrow{
    position:absolute;
    top:-10px;
    left:50%;
    transform:translateX(-50%) rotate(0deg);
    width:0; 
    height:0; 
    border-left:15px solid transparent;
    border-right:15px solid transparent;
    border-bottom:30px solid red;
}
</style>

let currentTurn = "";
const wheel = document.getElementById("wheel");
const popup = document.getElementById("popup");
const container = document.getElementById("cardsContainer");

function spinWheel(){
    const spins = Math.floor(Math.random()*5)+3; // لفات كاملة
    const randomDeg = Math.random()*180; // نصف الدائرة
    const totalDeg = spins*360 + randomDeg;

    wheel.style.transform = `rotate(${totalDeg}deg)`;

    // بعد انتهاء الدوران
    setTimeout(()=>{
        // إذا randomDeg < 90 أو > 270 → الأزرق → زوجة
        currentTurn = (randomDeg<90 || randomDeg>270) ? "زوجة" : "زوج";
        document.getElementById("turnInfo").innerText = `الدور: ${currentTurn}`;
        showPopup(`🎉 ${currentTurn} يبدأ اللعبة!`);
    },5100);
}

function createCards(){
    container.innerHTML="";
    cardsData.forEach((card)=>{
        const c = document.createElement("div");
        c.className="card";
        c.innerHTML = `
            <div class="inner">
                <div class="back">💎</div>
                <div class="front ${card.type}">${card.text}</div>
            </div>
        `;
        c.onclick=()=>{
            c.classList.toggle("flipped");
            showPopup(card.text);
            switchTurn();
        };
        container.appendChild(c);
    });
}

function shuffleCards(){
    cardsData.sort(()=>Math.random()-0.5);
    createCards();
}

function pickRandomCard(){
    const index = Math.floor(Math.random()*cardsData.length);
    const card = container.children[index];
    card.classList.add("flipped");
    showPopup(cardsData[index].text);
    switchTurn();
}

function switchTurn(){
    currentTurn = currentTurn==="زوج" ? "زوجة" : "زوج";
    document.getElementById("turnInfo").innerText = `الدور: ${currentTurn}`;
}

function showPopup(text){
    popup.innerText = text;
    popup.style.opacity = 1;
    setTimeout(()=>{ popup.style.opacity = 0; }, 3000);
}

createCards();
</script>
